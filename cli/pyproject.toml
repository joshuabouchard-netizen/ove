[project]
name = "ove"
version = "2.1.0"
description = "vg, the CLI behind OVE (Ops Video Editor): OpenRouter and fal.ai media calls, ffmpeg assembly, captions, checks"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "opentimelineio>=0.17",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vg = "vg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vg"]
